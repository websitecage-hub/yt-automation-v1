name: learn

# Weekly strategist pass: pull analytics, rewrite data/strategy.json, reweight the
# topic bank, and A/B new titles onto eligible under-performers. No-op offline.

on:
  schedule:
    - cron: "37 9 * * 1"        # Mondays, off the :00 mark
  workflow_dispatch: {}

concurrency:
  # R4: shared with produce/publish/comments -- one writer of data/ at a time.
  group: scaled-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-api-python-client google-auth
      - name: Learn
        env:
          META_KEY: ${{ secrets.META_KEY }}
          TABI_KEY: ${{ secrets.TABI_KEY }}
          TABI_KEY2: ${{ secrets.TABI_KEY2 }}
          NIM_KEY: ${{ secrets.NIM_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SEEKAI_KEY: ${{ secrets.SEEKAI_KEY }}
          SEEKAI_KEY2: ${{ secrets.SEEKAI_KEY2 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.learn
      - name: Commit state
        if: always()
        run: |
          git config user.name "scaled-bot"
          git config user.email "scaled-bot@users.noreply.github.com"
          git add data STATUS.md
          git commit -m "learn: strategy update [skip ci]" || echo "nothing to commit"
          # R4: never swallow a push rejection. Rebase + retry, fail loudly.
          for i in 1 2 3; do
            git pull --rebase && git push && break || sleep 15
          done
          git status --porcelain | grep -q . && { echo "STATE DID NOT LAND"; exit 1; } || true

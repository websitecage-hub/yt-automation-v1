name: comments

# Reply as Professor Croc to new comments on recently published videos.
# Full no-op when YouTube secrets are absent.

on:
  schedule:
    - cron: "41 */4 * * *"      # every 4h, off the :00 mark
  workflow_dispatch: {}

concurrency:
  group: scaled-comments
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-api-python-client google-auth
      - name: Reply to comments
        env:
          TABI_KEY: ${{ secrets.TABI_KEY }}
          NIM_KEY: ${{ secrets.NIM_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SEEKAI_KEY: ${{ secrets.SEEKAI_KEY }}
          SEEKAI_KEY2: ${{ secrets.SEEKAI_KEY2 }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.comments
      - name: Commit state
        if: always()
        run: |
          git config user.name "scaled-bot"
          git config user.email "scaled-bot@users.noreply.github.com"
          git add data STATUS.md
          git commit -m "comments: replies [skip ci]" || echo "nothing to commit"
          git push || echo "nothing to push"

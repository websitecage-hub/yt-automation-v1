name: voice-test

# Manual voice lab: clone a sample sentence through the Firebase voice API
# (same path + reference clip as produce), trim + pace it, upload the wav.
# The produce workflow stays paused via data/PAUSE; this runs regardless.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Sentence to clone"
        default: "Three thousand seven hundred pounds of force. That is my bite, measured on a rig, not guessed."
        required: true

concurrency:
  # Own group (NOT scaled-state): voice tests only read the repo and upload
  # an artifact, so variant runs safely execute in parallel.
  group: scaled-voice-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Clone sample
        run: |
          python3 -c "
          from pipeline import adapters, run
          data = adapters.tts('''${{ inputs.text }}''')
          data = run._finalize_voice(data, adapters.last_format('voice') or 'mp3')
          open('voice_sample.wav','wb').write(data)
          print('SAMPLE_OK', len(data))
          "
      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: voice-sample
          path: voice_sample.wav
          retention-days: 7

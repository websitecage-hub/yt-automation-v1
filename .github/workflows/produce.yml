name: produce

# Build the next video one stage at a time. The repo is the database: job state
# in data/videos/*.json is committed back after every run, so a killed run
# resumes on the next invocation. Intermediates in work/ are ephemeral and
# regenerated on demand.

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6h, off the :00 mark
  workflow_dispatch: {}

concurrency:
  # R4: all four workflows write data/ + STATUS.md. One shared group serializes
  # the writers so a push race can never silently drop a stage advance.
  group: scaled-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # pillow: compose crops every still to 1920x1080 and thumbnail.py paints the
      # whole brand layer. Without it the visuals and thumbnail stages both die.
      - run: pip install requests google-api-python-client google-auth pillow
      # Local voice (Chatterbox zero-shot clone on CPU, no API key): torch CPU
      # wheels first (default index would pull CUDA), then the TTS package.
      - run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install chatterbox-tts librosa soundfile
      # Model weights (~1GB from HuggingFace, first run only) survive between
      # runs in this cache; a miss just re-downloads, never fails the run.
      - name: Cache voice model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-weights-v1
          restore-keys: chatterbox-weights-
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # R3: work/ is ephemeral on a fresh runner, but paid art is not free.
      # Restore the last run's intermediates (voice, stills, word files) so a
      # kill during render resumes instead of re-buying every image + whisper
      # call. Misses silently fall back to regenerating everything.
      - name: Restore work/
        uses: actions/cache/restore@v4
        with:
          path: work/
          key: scaled-work-${{ hashFiles('data/videos/*.json') }}
          restore-keys: scaled-work-
      - name: Produce
        env:
          META_KEY: ${{ secrets.META_KEY }}
          TABI_KEY: ${{ secrets.TABI_KEY }}
          TABI_KEY2: ${{ secrets.TABI_KEY2 }}
          NIM_KEY: ${{ secrets.NIM_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SEEKAI_KEY: ${{ secrets.SEEKAI_KEY }}
          SEEKAI_KEY2: ${{ secrets.SEEKAI_KEY2 }}
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
          IMAGE_KEY: ${{ secrets.IMAGE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RUN_BUDGET_MIN: "300"
        run: python -m pipeline.run
      - name: Upload preview (video + thumbnail + stills + narration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            work/**/*.mp4
            work/**/*.jpg
            work/**/*.png
            work/**/*.webp
            work/**/*.mp3
            work/**/*.wav
            work/**/index.html
            data/videos/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save work/
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/
          key: scaled-work-${{ hashFiles('data/videos/*.json') }}-${{ github.run_id }}
      - name: Commit state
        if: always()
        run: |
          git config user.name "scaled-bot"
          git config user.email "scaled-bot@users.noreply.github.com"
          # assets/memes is a cache, not an intermediate: committing it is what
          # makes a meme survive to the next run instead of being re-bought.
          git add data STATUS.md assets/memes || true
          git commit -m "produce: advance pipeline [skip ci]" || echo "nothing to commit"
          # R4: never swallow a push rejection -- that is how stage advances get
          # silently lost (and re-uploaded). Rebase onto whoever won the race
          # and retry; fail loudly if the state still did not land.
          for i in 1 2 3; do
            git pull --rebase && git push && break || sleep 15
          done
          git status --porcelain | grep -q . && { echo "STATE DID NOT LAND"; exit 1; } || true

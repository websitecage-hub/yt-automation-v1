name: produce

# Build the next video one stage at a time. The repo is the database: job state
# in data/videos/*.json is committed back after every run, so a killed run
# resumes on the next invocation. Intermediates in work/ are ephemeral and
# regenerated on demand.

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6h, off the :00 mark
  workflow_dispatch: {}

concurrency:
  group: scaled-produce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # pillow: compose crops every still to 1920x1080 and thumbnail.py paints the
      # whole brand layer. Without it the visuals and thumbnail stages both die.
      - run: pip install requests google-api-python-client google-auth pillow
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Produce
        env:
          META_KEY: ${{ secrets.META_KEY }}
          TABI_KEY: ${{ secrets.TABI_KEY }}
          TABI_KEY2: ${{ secrets.TABI_KEY2 }}
          NIM_KEY: ${{ secrets.NIM_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SEEKAI_KEY: ${{ secrets.SEEKAI_KEY }}
          SEEKAI_KEY2: ${{ secrets.SEEKAI_KEY2 }}
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
          IMAGE_KEY: ${{ secrets.IMAGE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RUN_BUDGET_MIN: "300"
        run: python -m pipeline.run
      - name: Upload preview (video + thumbnail + stills + narration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            work/**/*.mp4
            work/**/*.jpg
            work/**/*.png
            work/**/*.webp
            work/**/*.mp3
            work/**/*.wav
            work/**/index.html
            data/videos/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit state
        if: always()
        run: |
          git config user.name "scaled-bot"
          git config user.email "scaled-bot@users.noreply.github.com"
          # assets/memes is a cache, not an intermediate: committing it is what
          # makes a meme survive to the next run instead of being re-bought.
          git add data STATUS.md assets/memes || true
          git commit -m "produce: advance pipeline [skip ci]" || echo "nothing to commit"
          git push || echo "nothing to push"
